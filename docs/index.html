.meta{color:var(--muted);margin:4px 0 8px;font-size:14px}

.badge.galicia{background:var(--galicia);color:#fff}
.badge.unconfirmed{background:#b45309;color:#fff}
.signals{font-size:12px;color:var(--muted);margin-bottom:8px}
.snippet{font-size:13px;color:var(--muted);margin:0 0 10px}

.keys span b{font-weight:600}
details{margin:0 0 10px;border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--accent)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
@media (max-width:640px){.cols{grid-template-columns:1fr}}
.cols h4{margin:0 0 4px;font-size:13px}
.cols ul{margin:0;padding-left:18px;font-size:13px;color:var(--text)}
.cols li{margin-bottom:3px}
.cols .none{font-size:13px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:inherit;font-size:13px;padding:7px 12px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.empty{text-align:center;color:var(--muted);padding:40px 0}
footer{max-width:960px;margin:0 auto;padding:0 16px 30px;font-size:12px;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:12px}
.toolbar .btn:disabled{opacity:.6;cursor:default}
.runstatus{font-size:13px;color:var(--muted)}
.tokenlink{font-size:12px;color:var(--muted);text-decoration:underline;cursor:pointer;margin-left:auto}
.syncstatus{font-size:12px;color:var(--muted)}
</style>
</head>

<script>
(function () {
  const data = JSON.parse(document.getElementById('data').textContent);
  const SOURCE_LABEL = { linkedin: 'LinkedIn', indeed: 'Indeed', tecnoempleo: 'Tecnoempleo' };
  const MOD_LABEL = { remoto: '100% remoto', galicia: 'Galicia' };
  const WP_LABEL = { remoto: 'Remoto', hibrido: 'Híbrido', presencial: 'Presencial', 'sin especificar': 'Modalidad sin especificar' };
  const STATUS_LABEL = { saved: 'Guardada', applied: 'Aplicada', discarded: 'Descartada' };
  const KEY = 'empleo-radar-status';
  let statuses = {};
  try { statuses = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { statuses = {}; }
  statuses = Object.assign({}, data.feedback || {}, statuses);
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(statuses)); } catch (e) { /* private mode */ } };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // Portals sometimes keep the original posting date on reposted ads (Indeed showed a
  // January date for an active offer), so age filtering and sorting use the day the radar found it.
  const jobDate = (j) => (j.notified_at || j.posted || '').slice(0, 10);
  const fmtDate = (iso) => {
    if (!iso) return 'fecha n/d';
    const d = new Date(iso.slice(0, 10) + 'T00:00:00');
    return isNaN(d) ? iso : d.toLocaleDateString('es-ES', { day: '2-digit', month: 'short' });
  };

  function render() {
    const q = $('q').value.trim().toLowerCase();
    const source = $('source').value;
    const modality = $('modality').value;
    const days = parseInt($('days').value, 10);
    const statusFilter = $('status').value;
    const minScore = parseInt($('score').value, 10);
    $('scoreVal').textContent = minScore;
    const cutoff = days ? new Date(Date.now() - days * 86400000).toISOString().slice(0, 10) : '';
    const rows = data.matches.filter((j) => {
      const st = statuses[j.id] || '';
      if (statusFilter === 'open' && (st === 'discarded' || st === 'applied')) return false;
      if (statusFilter && statusFilter !== 'open' && st !== statusFilter) return false;
      if (source && j.source !== source) return false;
      if (modality && j.modality !== modality) return false;
      if (j.score < minScore) return false;
      if (cutoff && jobDate(j) < cutoff) return false;
      if (q && !(j.title + ' ' + j.company + ' ' + j.location).toLowerCase().includes(q)) return false;
      return true;
    }).sort((a, b) => (b.score - a.score) || jobDate(b).localeCompare(jobDate(a)));
    $('count').textContent = rows.length + (rows.length === 1 ? ' oferta' : ' ofertas') + ' de ' + data.matches.length + ' encontradas';
    $('list').innerHTML = rows.length ? rows.map(card).join('') : '<div class="empty">Ninguna oferta coincide con los filtros.</div>';
  }

  function card(j) {
    const st = statuses[j.id] || '';
    const platform = SOURCE_LABEL[j.source] || esc(j.source);
    return `<article class="card ${st === 'discarded' || st === 'applied' ? 'done' : ''}" data-id="${esc(j.id)}">
      <div class="top">
        <a class="title" href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a>
        <span class="score" title="Afinidad con el perfil">${j.score}/100</span>
      </div>
      <div class="meta">${esc(j.company || 'Empresa no indicada')} · ${esc(j.location || 'ubicación n/d')}</div>
      <div class="badges">
        ${j.modality === 'remoto' && j.workplace === 'sin confirmar'
          ? '<span class="badge unconfirmed" title="LinkedIn la devuelve como remota pero el anuncio no lo dice: compruébalo antes de aplicar">Remoto sin confirmar</span>'
          : `<span class="badge ${esc(j.modality)}">${MOD_LABEL[j.modality] || esc(j.modality)}</span>`}
        ${j.modality === 'galicia' && j.workplace ? `<span class="badge">${WP_LABEL[j.workplace] || esc(j.workplace)}</span>` : ''}
        <span class="badge">${platform}</span>
        <span class="badge">Publicada ${fmtDate(j.posted)}</span>
        ${st ? `<span class="badge">${STATUS_LABEL[st]}</span>` : ''}
      </div>
      ${j.signals && j.signals.length ? `<div class="signals">${esc(j.signals.join(' · '))}</div>` : ''}
      ${j.description ? `<p class="snippet">${esc(j.description.slice(0, 240))}…</p>` : ''}
      ${keysHtml(j)}
      ${detailsHtml(j)}
      <div class="actions">
        <a class="btn primary" href="${esc(j.url)}" target="_blank" rel="noopener">Ver y aplicar en ${platform} ↗</a>
        <button class="btn ${st === 'saved' ? 'active' : ''}" data-status="saved">Guardar</button>
        <button class="btn ${st === 'applied' ? 'active' : ''}" data-status="applied">Aplicada</button>
        <button class="btn ${st === 'discarded' ? 'active' : ''}" data-status="discarded">Descartar</button>
      </div>
    </article>`;
  }

  const KEY_LABEL = { etiqueta: 'Etiqueta del portal', modalidad: 'Modalidad', salario: 'Salario', horario: 'Horario', experiencia: 'Experiencia', contrato: 'Contrato' };
  function keysHtml(j) {
    const k = (j.details && j.details.claves) || {};
    const parts = Object.keys(KEY_LABEL).filter((n) => k[n]).map((n) => `<span><b>${KEY_LABEL[n]}:</b> ${esc(k[n])}</span>`);
    return parts.length ? `<div class="keys">${parts.join('')}</div>` : '';
  }
  function detailsHtml(j) {
    const d = j.details || {};
    const req = d.requisitos || [];
    const off = d.ofrecen || [];
    if (!req.length && !off.length) return '';
    const list = (items) => items.length ? `<ul>${items.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : '<div class="none">No se ha detectado esta sección en el anuncio.</div>';
    return `<details><summary>Requisitos y qué ofrecen</summary><div class="cols">
      <div><h4>Requisitos, competencias y experiencia</h4>${list(req)}</div>
      <div><h4>Qué ofrecen</h4>${list(off)}</div></div></details>`;
  }

  $('list').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-status]');
    if (!btn) return;
    const id = btn.closest('article').dataset.id;
    const s = btn.dataset.status;
    if (statuses[id] === s) delete statuses[id]; else statuses[id] = s;
    persist();
    render();
    syncStatus(id, statuses[id] || null);
  });

  // ---- GitHub integration: run the search and share statuses through the repo ----------
  const REPO = data.repo;
  const WORKFLOW = data.workflow || 'radar.yml';
  const TOKEN_KEY = 'empleo-radar-token';
  let token = '';
  try { token = localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { token = ''; }
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const setRun = (msg) => { $('runStatus').textContent = msg; };
  const setSync = (msg) => { $('syncStatus').textContent = msg; };
  const b64 = (str) => btoa(unescape(encodeURIComponent(str)));
  const unb64 = (str) => decodeURIComponent(escape(atob(str.replace(/\n/g, ''))));

  function updateTokenLink() {
    $('tokenLink').textContent = token ? 'Token de GitHub configurado · cambiar' : 'Configurar token de GitHub';
  }
  function askToken() {
    const t = prompt('Pega un token de GitHub (fine-grained) limitado al repositorio ' + REPO +
      ' con permisos Actions: lectura y escritura, y Contents: lectura y escritura.\n' +
      'Se guarda solo en este navegador. Deja vacío para borrarlo.', token);
    if (t === null) return false;
    token = t.trim();
    try { token ? localStorage.setItem(TOKEN_KEY, token) : localStorage.removeItem(TOKEN_KEY); } catch (e) { /* private mode */ }
    updateTokenLink();
    return !!token;
  }
  async function gh(path, init) {
    init = init || {};
    const r = await fetch('https://api.github.com/repos/' + REPO + path, Object.assign({}, init, {
      headers: Object.assign({ Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28' }, init.headers || {}),
    }));
    if (!r.ok) throw new Error('GitHub ' + r.status + ': ' + (await r.text()).slice(0, 140));
    return r.status === 204 ? null : r.json();
  }

  async function runSearch() {
    if (!REPO) { setRun('Falta site.github_repo en config.yaml.'); return; }
    if (!token && !askToken()) return;
    const btn = $('runBtn');
    btn.disabled = true;
    setRun('Lanzando la búsqueda en GitHub…');
    const startedAt = Date.now() - 60000;
    try {
      await gh('/actions/workflows/' + WORKFLOW + '/dispatches', { method: 'POST', body: JSON.stringify({ ref: 'main', inputs: {} }) });
    } catch (e) {
      setRun('No se pudo lanzar: ' + e.message + ' Revisa el token (permiso Actions).');
      btn.disabled = false;
      return;
    }
    let run = null;
    for (let i = 0; i < 12 && !run; i++) {
      await sleep(5000);
      try {
        const d = await gh('/actions/workflows/' + WORKFLOW + '/runs?event=workflow_dispatch&per_page=1');
        const r = d.workflow_runs && d.workflow_runs[0];
        if (r && new Date(r.created_at).getTime() >= startedAt) run = r;
      } catch (e) { /* retry */ }
    }
    if (!run) {
      setRun('La búsqueda se lanzó pero no encuentro la ejecución. Consulta la pestaña Actions de GitHub.');
      btn.disabled = false;
      return;
    }
    const t0 = Date.now();
    while (run.status !== 'completed' && Date.now() - t0 < 15 * 60000) {
      const mins = Math.round((Date.now() - t0) / 60000);
      setRun('Buscando en LinkedIn, Indeed y Tecnoempleo… (' + (mins ? mins + ' min' : 'iniciando') + '). Suele tardar 3-4 minutos.');
      await sleep(10000);
      try { run = await gh('/actions/runs/' + run.id); } catch (e) { /* retry */ }
    }
    if (run.status !== 'completed') { setRun('La búsqueda sigue en marcha en GitHub; recarga la página más tarde.'); btn.disabled = false; return; }
    setRun(run.conclusion === 'success'
      ? 'Búsqueda terminada. Esperando a que se publique la página…'
      : 'Búsqueda terminada con avisos (probablemente el correo). Esperando a que se publique la página…');
    for (let i = 0; i < 30; i++) {
      await sleep(10000);
      try {
        const html = await (await fetch(location.pathname + '?t=' + Date.now(), { cache: 'no-store' })).text();
        const m = html.match(/type="application\/json">(.*?)<\/script>/s);
        if (m && JSON.parse(m[1]).generated_at > data.generated_at) { location.reload(); return; }
      } catch (e) { /* retry */ }
    }
    setRun('La búsqueda terminó pero la página aún no se ha publicado. Recarga en un minuto.');
    btn.disabled = false;
  }

  let syncChain = Promise.resolve();
  function syncStatus(id, status) {
    if (!token || !REPO) return;
    syncChain = syncChain.then(() => pushStatus(id, status)).catch(() => {});
  }
  async function pushStatus(id, status) {
    setSync('Guardando en el repositorio…');
    try {
      let sha = null, server = {};
      try {
        const f = await gh('/contents/data/feedback.json?ref=main');
        sha = f.sha;
        server = (JSON.parse(unb64(f.content)).statuses) || {};
      } catch (e) { if (!/GitHub 404/.test(e.message)) throw e; }
      if (status) server[id] = status; else delete server[id];
      statuses = Object.assign({}, server);   // the repo is the shared truth once synced
      persist();
      render();
      const body = { message: 'Update offer statuses from the page', branch: 'main',
        content: b64(JSON.stringify({ statuses: server, updated_at: new Date().toISOString() }, null, 1) + '\n') };
      if (sha) body.sha = sha;
      await gh('/contents/data/feedback.json', { method: 'PUT', body: JSON.stringify(body) });
      setSync('Estados guardados en el repositorio ✓');
    } catch (e) {
      setSync('No se pudo guardar en el repositorio: ' + e.message);
    }
  }
  async function loadSharedStatuses() {
    if (!REPO) return;
    try {
      const r = await fetch('https://raw.githubusercontent.com/' + REPO + '/main/data/feedback.json?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) return;
      const server = (await r.json()).statuses || {};
      statuses = Object.assign({}, server, statuses);
      persist();
      render();
    } catch (e) { /* offline or file:// — keep local/embedded statuses */ }
  }

  $('runBtn').addEventListener('click', runSearch);
  $('tokenLink').addEventListener('click', (e) => { e.preventDefault(); askToken(); });
  updateTokenLink();
  loadSharedStatuses();
  ['q', 'source', 'modality', 'days', 'status', 'score'].forEach((id) => $(id).addEventListener('input', render));

  const gen = new Date(data.generated_at);
  $('updated').textContent = 'Actualizado el ' + gen.toLocaleString('es-ES', { dateStyle: 'long', timeStyle: 'short' })
    + '. La búsqueda se repite tres veces al día en LinkedIn, Indeed y Tecnoempleo. Las marcas de guardada, aplicada o descartada se guardan en este navegador y, con el token configurado, se comparten a través del repositorio.';
  if (data.last_run && data.last_run.stats) {
    $('footer').textContent = 'Última búsqueda: ' + Object.entries(data.last_run.stats)
      .map(([k, v]) => `${SOURCE_LABEL[k] || k} ${v.fetched} leídas, ${v.candidates} candidatas, ${v.accepted} nuevas` + (v.errors && v.errors.length ? `, ${v.errors.length} errores` : ''))
      .join(' · ');
  }
  render();
})();
</script>
</body>
</html>
