name: radar

on:
  schedule:
    # 09:00, 14:00 and 19:00 Madrid time during CEST (UTC+2).
    - cron: "0 7,12,17 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: no email, no state changes"
        type: boolean
        default: false
      since_hours:
        description: "Lookback window in hours (blank = config)"
        type: string
        default: ""
      test_mail:
        description: "Only send a test email with the configured secrets"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run radar
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
          SINCE: ${{ inputs.since_hours != '' && format('--since-hours {0}', inputs.since_hours) || '' }}
        run: |
          if [ "${{ inputs.test_mail }}" = "true" ]; then
            python -m radar test-mail
          else
            python -m radar run $DRY_RUN $SINCE
          fi

      - name: Persist state
        # Runs even if the radar step failed (e.g. SMTP error): the state and the page are
        # written before the step exits, and the email is retried on the next run.
        if: ${{ !cancelled() && !inputs.dry_run && !inputs.test_mail }}
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "chore: update radar state"
            git pull --rebase origin main   # the page may have committed data/feedback.json meanwhile
            git push
          fi
